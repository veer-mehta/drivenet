services:
  - type: web
    name: drivenet
    runtime: static
    buildCommand: sh build_web.sh
    staticPublishPath: web
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://accounts.google.com; connect-src 'self' https://cdn.jsdelivr.net https://www.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; style-src 'self' https://accounts.google.com; img-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
